[package]
name = "subcontractor-margin-chain-server"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8.4"
fs2 = "0.4.3"
httpdate = "1.0.3"
quick-xml = { version = "0.38.3", features = ["serialize"] }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal", "net", "fs"] }
tower-http = { version = "0.6.6", features = ["catch-panic", "compression-gzip", "fs", "limit", "request-id", "set-header", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
uuid = { version = "1.18.0", features = ["serde", "v7"] }

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.21.0"
tower = { version = "0.5.2", features = ["util"] }
